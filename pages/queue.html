<!-- Page: Patient Queue -->
<div class="page-enter">
  <div class="page-header">
    <h1>🗂️ Patient Queue</h1>
    <p>All active encounters for today. Tap any patient to view their case.</p>
  </div>

  <!-- Filter Row -->
  <div style="display:flex;gap:10px;margin-bottom:22px;flex-wrap:wrap;" class="reveal">
    <span class="risk risk-gray" style="cursor:pointer;padding:8px 16px;font-size:12.5px;">All Active</span>
    <div style="margin-left:auto;">
      <input class="form-input" id="queue-search" placeholder="Search patient name…" style="width:220px;padding:8px 12px;font-size:13px;"/>
    </div>
  </div>

  <div class="card reveal delay-1">
    <div class="card-header">
      <div class="card-title">Today's Patient Queue</div>
      <span class="risk risk-gray" id="queue-count-badge">1 active</span>
    </div>
    <div class="stagger-list" id="queue-patient-list">
      <div class="patient-row" onclick="navigateTo('triage')">
        <div class="patient-avatar" style="background:linear-gradient(135deg,#E8692A,#F4A261)" id="queue-avatar">PAT</div>
        <div style="flex:1;">
          <div class="patient-name" id="queue-p-name">Active Patient</div>
          <div class="patient-meta" id="queue-p-meta">Voice &amp; Clinical Context Available</div>
        </div>
        <span class="risk risk-amber" id="queue-p-risk"><span class="risk-dot"></span>ACTIVE</span>
      </div>
    </div>
  </div>
</div>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    initQueuePage();
  });
</script>
